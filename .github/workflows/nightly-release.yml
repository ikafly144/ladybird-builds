name: Ladybird Nightly Release

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Ladybird Repository'
        required: false
        default: 'LadybirdBrowser/ladybird'
        type: string
      upstream_ref:
        description: 'Git branch, tag, or commit SHA to build'
        required: false
        default: 'master'
        type: string
      build_linux:
        description: 'Build Linux (AppImage & Tarball)'
        required: false
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows (NSIS & ZIP) [Experimental]'
        required: false
        default: true
        type: boolean
      build_android:
        description: 'Build Android (APK)'
        required: false
        default: true
        type: boolean
      is_prerelease:
        description: 'Mark release as pre-release'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  # =========================================================================
  # 1. Metadata Job: Determine upstream commit SHA, tag name, release title
  # =========================================================================
  metadata:
    name: Prepare Metadata
    runs-on: ubuntu-24.04
    outputs:
      upstream_repo: ${{ steps.meta.outputs.upstream_repo }}
      upstream_ref: ${{ steps.meta.outputs.upstream_ref }}
      upstream_sha: ${{ steps.meta.outputs.upstream_sha }}
      upstream_short_sha: ${{ steps.meta.outputs.upstream_short_sha }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_date: ${{ steps.meta.outputs.release_date }}
      build_linux: ${{ steps.meta.outputs.build_linux }}
      build_windows: ${{ steps.meta.outputs.build_windows }}
      build_android: ${{ steps.meta.outputs.build_android }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Resolve Upstream Commit & Generate Metadata
        id: meta
        shell: sh
        env:
          INPUT_REPO: ${{ inputs.upstream_repo || 'LadybirdBrowser/ladybird' }}
          INPUT_REF: ${{ inputs.upstream_ref || 'master' }}
          INPUT_LINUX: ${{ github.event_name == 'schedule' || inputs.build_linux != false }}
          INPUT_WINDOWS: ${{ github.event_name == 'schedule' || inputs.build_windows != false }}
          INPUT_ANDROID: ${{ github.event_name == 'schedule' || inputs.build_android != false }}
          INPUT_PRERELEASE: ${{ github.event_name == 'schedule' || inputs.is_prerelease != false }}
        run: |
          sh ./scripts/check-upstream.sh

  # =========================================================================
  # 2. Linux Build Job: Compiles Ladybird with Qt 6.9+ and packages concurrently
  # =========================================================================
  build-linux:
    name: Build Linux (x86_64)
    needs: [metadata]
    if: ${{ needs.metadata.outputs.build_linux == 'true' }}
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      VCPKG_ROOT: ${{ github.workspace }}/ladybird/Build/vcpkg
    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout Ladybird Upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.metadata.outputs.upstream_repo }}
          ref: ${{ needs.metadata.outputs.upstream_sha }}
          path: ladybird
          submodules: recursive

      - name: Setup Ccache Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ runner.os }}-${{ needs.metadata.outputs.upstream_short_sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ runner.os }}-${{ needs.metadata.outputs.upstream_short_sha }}
            ccache-linux-${{ runner.os }}-

      - name: Setup vcpkg Binary Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-linux-${{ runner.os }}-${{ hashFiles('ladybird/vcpkg.json', 'ladybird/Meta/vcpkg/vcpkg.json') }}
          restore-keys: |
            vcpkg-linux-${{ runner.os }}-

      - name: Install Build Dependencies
        shell: sh
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            autoconf autoconf-archive automake build-essential ccache cmake curl \
            fonts-liberation2 git glslang-tools libdrm-dev libgl1-mesa-dev libncurses-dev \
            libpulse-dev libtool nasm ninja-build pkg-config python3-venv python3-pip \
            tar unzip zip libfuse2 libfuse3-dev patchelf libxcb-cursor0 \
            libedit-dev gcc-14 g++-14 libssl-dev libx11-xcb-dev libglu1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev

      - name: Install Qt 6.9
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          host: 'linux'
          target: 'desktop'
          modules: 'qtpositioning'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python Dependencies
        shell: sh
        run: |
          python3 -m pip install --break-system-packages pyyaml requests six cryptography

      - name: Initialize Ccache
        shell: sh
        run: |
          sh ./builder/scripts/setup-ccache.sh

      - name: Build Ladybird
        shell: sh
        working-directory: ladybird
        run: |
          python3 Meta/ladybird.py build --preset Release --cc gcc-14 --cxx g++-14 || {
            echo "Direct preset build fallback with explicit Qt6 CMAKE_PREFIX_PATH..."
            cmake -B Build/release -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=gcc-14 \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR:-/opt/Qt/6.9.0/gcc_64}" \
              -DCMAKE_TOOLCHAIN_FILE=Build/vcpkg/scripts/buildsystems/vcpkg.cmake \
              -DENABLE_CI_BASELINE_CPU=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            ninja -C Build/release Ladybird
          }

      - name: Package Portable Tarball
        id: pkg_linux_tarball
        background: true
        shell: sh
        env:
          SOURCE_DIR: ${{ github.workspace }}/ladybird
          BUILD_DIR: ${{ github.workspace }}/ladybird/Build/release
          OUTPUT_DIR: ${{ github.workspace }}/artifacts/linux
          VERSION_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: |
          sh ./builder/packaging/linux/package-tarball.sh

      - name: Package Standalone AppImage
        id: pkg_linux_appimage
        background: true
        shell: sh
        env:
          SOURCE_DIR: ${{ github.workspace }}/ladybird
          BUILD_DIR: ${{ github.workspace }}/ladybird/Build/release
          OUTPUT_DIR: ${{ github.workspace }}/artifacts/linux
          VERSION_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: |
          sh ./builder/packaging/linux/package-appimage.sh

      - name: Wait for Linux Packaging Steps
        wait: [pkg_linux_tarball, pkg_linux_appimage]

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-linux-x86_64
          path: artifacts/linux/*
          if-no-files-found: error
          retention-days: 5

  # =========================================================================
  # 3. Windows Build Job: Experimental native build + concurrent NSIS & ZIP
  # =========================================================================
  build-windows:
    name: Build Windows (x86_64) [Experimental]
    needs: [metadata]
    if: ${{ needs.metadata.outputs.build_windows == 'true' }}
    runs-on: windows-latest
    continue-on-error: true
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      VCPKG_ROOT: ${{ github.workspace }}/ladybird/Build/vcpkg
    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout Ladybird Upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.metadata.outputs.upstream_repo }}
          ref: ${{ needs.metadata.outputs.upstream_sha }}
          path: ladybird
          submodules: recursive

      - name: Initialize MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ccache Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ runner.os }}-${{ needs.metadata.outputs.upstream_short_sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-windows-${{ runner.os }}-${{ needs.metadata.outputs.upstream_short_sha }}
            ccache-windows-${{ runner.os }}-

      - name: Setup vcpkg Binary Cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-windows-${{ runner.os }}-${{ hashFiles('ladybird/vcpkg.json', 'ladybird/Meta/vcpkg/vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-${{ runner.os }}-

      - name: Install Windows Tools & Dependencies
        shell: pwsh
        run: |
          choco install -y pkgconfiglite ninja nsis nasm ccache llvm
          "C:\Program Files\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        shell: pwsh
        run: |
          pip install pyyaml requests six cryptography

      - name: Build Ladybird for Windows
        id: build_step
        shell: pwsh
        working-directory: ladybird
        run: |
          python Meta/ladybird.py build --preset Release

      - name: Package Portable ZIP
        if: steps.build_step.outcome == 'success'
        id: pkg_win_zip
        background: true
        shell: bash
        env:
          SOURCE_DIR: ${{ github.workspace }}/ladybird
          BUILD_DIR: ${{ github.workspace }}/ladybird/Build/release
          OUTPUT_DIR: ${{ github.workspace }}/artifacts/windows
          VERSION_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: |
          bash ./builder/packaging/windows/package-zip.sh

      - name: Compile NSIS Installer
        if: steps.build_step.outcome == 'success'
        id: pkg_win_nsis
        background: true
        shell: bash
        env:
          SOURCE_DIR: ${{ github.workspace }}/ladybird
          BUILD_DIR: ${{ github.workspace }}/ladybird/Build/release
          OUTPUT_DIR: ${{ github.workspace }}/artifacts/windows
          VERSION_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: |
          bash ./builder/packaging/windows/package-nsis.sh

      - name: Wait for Windows Packaging Steps
        wait: [pkg_win_zip, pkg_win_nsis]

      - name: Upload Windows Artifacts
        if: steps.build_step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-windows-x86_64
          path: artifacts/windows/*
          if-no-files-found: warn
          retention-days: 5

  # =========================================================================
  # 4. Android Build Job: Compiles Android UI & packages APKs concurrently
  # =========================================================================
  build-android:
    name: Build Android (arm64-v8a & x86_64)
    needs: [metadata]
    if: ${{ needs.metadata.outputs.build_android == 'true' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      VCPKG_ROOT: ${{ github.workspace }}/ladybird/Build/vcpkg
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.13599879
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/29.0.13599879
      VCPKG_DEFAULT_BINARY_CACHE: ~/.cache/vcpkg
    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout Ladybird Upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.metadata.outputs.upstream_repo }}
          ref: ${{ needs.metadata.outputs.upstream_sha }}
          path: ladybird
          submodules: recursive

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK & NDK Components
        shell: sh
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0" "cmake;3.22.1" "ndk;29.0.13599879"

      - name: Install Rust Toolchain for Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Setup Ccache Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-android-${{ runner.os }}-${{ needs.metadata.outputs.upstream_short_sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-${{ runner.os }}-${{ needs.metadata.outputs.upstream_short_sha }}
            ccache-android-${{ runner.os }}-

      - name: Setup vcpkg Binary Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-android-${{ runner.os }}-${{ hashFiles('ladybird/vcpkg.json', 'ladybird/Meta/vcpkg/vcpkg.json') }}
          restore-keys: |
            vcpkg-android-${{ runner.os }}-

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Host & Cross Build Tools
        shell: sh
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            autoconf autoconf-archive automake build-essential ccache cmake curl \
            git nasm ninja-build pkg-config python3-venv python3-pip tar unzip zip \
            gperf bison flex gettext meson libtool m4

      - name: Install Python Dependencies
        shell: sh
        run: |
          python3 -m pip install --break-system-packages pyyaml requests six cryptography

      - name: Initialize vcpkg for Android
        shell: sh
        working-directory: ladybird
        run: |
          mkdir -p Build ~/.cache/vcpkg
          if [ ! -d "Build/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git Build/vcpkg
            ./Build/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Build Android Gradle Project
        id: android_build
        shell: sh
        working-directory: ladybird
        run: |
          for candidate in "UI/Android" "Android" "."; do
            if [ -f "${candidate}/gradlew" ]; then
              cd "${candidate}"
              chmod +x gradlew
              ./gradlew assembleDebug \
                --no-daemon \
                --stacktrace \
                -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
                -Dorg.gradle.parallel=true || {
                  echo "::warning::Android Gradle build failed (Upstream Android support is experimental)."
                  exit 1
                }
              break
            fi
          done

      - name: Package & Sign Android arm64-v8a APK
        if: steps.android_build.outcome == 'success'
        id: pkg_android_arm64
        background: true
        shell: sh
        env:
          SOURCE_DIR: ${{ github.workspace }}/ladybird
          OUTPUT_DIR: ${{ github.workspace }}/artifacts/android
          TARGET_ABI: arm64-v8a
          VERSION_TAG: ${{ needs.metadata.outputs.release_tag }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sh ./builder/packaging/android/package-abi.sh

      - name: Package & Sign Android x86_64 APK
        if: steps.android_build.outcome == 'success'
        id: pkg_android_x86_64
        background: true
        shell: sh
        env:
          SOURCE_DIR: ${{ github.workspace }}/ladybird
          OUTPUT_DIR: ${{ github.workspace }}/artifacts/android
          TARGET_ABI: x86_64
          VERSION_TAG: ${{ needs.metadata.outputs.release_tag }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sh ./builder/packaging/android/package-abi.sh

      - name: Wait for Android Packaging Steps
        wait: [pkg_android_arm64, pkg_android_x86_64]

      - name: Upload Android Artifacts
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-android-apks
          path: artifacts/android/*
          if-no-files-found: warn
          retention-days: 5

  # =========================================================================
  # 5. Release Job: Aggregates artifacts, checksums, changelog & publishes Release
  # =========================================================================
  release:
    name: Publish GitHub Release
    needs: [metadata, build-linux, build-windows, build-android]
    if: always() && needs.metadata.result == 'success' && (needs.build-linux.result == 'success' || needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Prepare Release Bundle & SHA256 Checksums
        id: bundle
        shell: sh
        env:
          UPSTREAM_REPO: ${{ needs.metadata.outputs.upstream_repo }}
          UPSTREAM_SHA: ${{ needs.metadata.outputs.upstream_sha }}
          UPSTREAM_SHORT_SHA: ${{ needs.metadata.outputs.upstream_short_sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          RELEASE_DATE: ${{ needs.metadata.outputs.release_date }}
        run: |
          mkdir -p downloaded-artifacts release-assets
          find downloaded-artifacts -type f -exec cp {} release-assets/ \; 2>/dev/null || true
          
          cd release-assets
          if [ -n "$(ls -A . 2>/dev/null)" ]; then
            sha256sum * > SHA256SUMS.txt 2>/dev/null || true
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          fi
          cd ..

          sh ./scripts/generate-changelog.sh > RELEASE_NOTES.md

      - name: Create Dated GitHub Release
        if: steps.bundle.outputs.has_assets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          name: "Ladybird Nightly ${{ needs.metadata.outputs.release_date }} (${{ needs.metadata.outputs.upstream_short_sha }})"
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.metadata.outputs.is_prerelease == 'true' }}
          draft: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Rolling 'nightly' Tag & Release
        if: steps.bundle.outputs.has_assets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Ladybird Latest Nightly"
          body_path: RELEASE_NOTES.md
          prerelease: true
          draft: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
